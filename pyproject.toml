[project]
name = "claims-agent"
version = "0.1.0"
description = "Insurance claim validation agent (gpt-4o-mini + ChromaDB policy KB + SQLite memory/cost/audit)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.55",
    "chromadb>=1.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "httpx>=0.27",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
