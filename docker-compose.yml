services:
  claims-agent:
    build: .
    image: claims-agent:latest
    container_name: claims-agent
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file: .env
    volumes:
      - ./data:/srv/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
